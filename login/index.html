<style>
::selection{background:rgba(255,249,62,.2);}
:root {
  --accent: #fff93e;
  --accent-dim: rgba(255,249,62,.08);
  --accent-mid: rgba(255,249,62,.18);
  --accent-glow: rgba(255,249,62,.35);
  --bg: #080a0f;
  --panel: #11141e;
  --panel-2: #0d101a;
  --border: #1a2030;
  --border-strong: #232a3d;
  --muted: #4a5568;
  --muted-light: #8b95a8;
  --text: #c8d0dc;
  --green: #4ade80;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
img { -webkit-user-drag: none; user-select: none; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: #fff;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { text-decoration: none; color: inherit; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #1e2535; border-radius: 10px; }

/* Noise tone overlay (matches the rest of the site) */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 500;
  pointer-events: none;
  opacity: .018;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
}
.bg-art {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.bg-art::before {
  content: ""; position: absolute; inset: 0;
  background: url("/Fortized banner.png?v=2") center/cover no-repeat;
  opacity: .07;
  filter: saturate(.7);
}
.bg-art::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 18% 30%, rgba(255,249,62,.06), transparent 60%),
    radial-gradient(ellipse 60% 50% at 82% 70%, rgba(96,165,250,.04), transparent 60%),
    linear-gradient(180deg, rgba(8,10,15,.55) 0%, var(--bg) 100%);
}

/* ── Unified site nav (matches homepage) ── */
.nav-root{position:fixed;top:0;left:0;right:0;z-index:300;height:56px;display:flex;align-items:center;padding:0 36px;background:rgba(8,10,15,.0);transition:background .35s,border-color .35s,box-shadow .35s}
.nav-root.scrolled{background:rgba(8,10,15,.96);backdrop-filter:blur(28px) saturate(200%);border-bottom:1px solid var(--border);box-shadow:0 1px 40px rgba(0,0,0,.5)}
.nav-logo{display:flex;align-items:center;gap:9px;flex-shrink:0;margin-right:28px}
.nav-logo img{height:24px;width:24px;object-fit:contain}
.nav-logo-word{font-family:var(--font-display);font-size:16px;font-weight:800;color:#fff;letter-spacing:-.5px}
.nav-pill-group{display:flex;align-items:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:3px;gap:1px}
.nav-pill{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted-light);padding:6px 13px;border-radius:8px;transition:color .15s,background .15s;white-space:nowrap}
.nav-pill:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-pill.active{color:#fff;background:rgba(255,255,255,.09)}
.nav-sep{width:1px;height:20px;background:rgba(255,255,255,.07);margin:0 12px;flex-shrink:0}
.nav-spacer{flex:1}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-btn-login{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted-light);padding:7px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);transition:.15s}
.nav-btn-login:hover{color:#fff;border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.06)}
.nav-btn-cta{font-family:var(--font-display);font-size:13px;font-weight:700;color:#080a0f;background:var(--accent);padding:8px 18px;border-radius:9px;transition:box-shadow .2s,filter .15s,transform .14s}
.nav-btn-cta:hover{box-shadow:0 0 28px var(--accent-glow);filter:brightness(1.06);transform:translateY(-1px)}
@media (max-width: 900px) { .nav-pill-group, .nav-sep { display: none; } }
@media (max-width: 600px) { .nav-btn-login { display: none; } }
@media (max-width: 768px) { .nav-root { padding: 0 18px; } }

/* ── Auth shell (single centered card, Discord-style) ── */
.auth-shell {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 110px 24px 60px;
}
.auth-pane-form { display: flex; flex-direction: column; gap: 14px; max-width: 440px; width: 100%; }
.auth-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 40px 38px 36px;
  position: relative;
  isolation: isolate;
  box-shadow: 0 32px 80px rgba(0,0,0,.45);
}
.auth-card::before {
  content: ""; position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at 90% -10%, rgba(255,249,62,.07), transparent 55%);
  pointer-events: none; z-index: 0;
}
.auth-card > * { position: relative; z-index: 1; }
.auth-card.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
  10%,90% { transform: translateX(-1.5px); }
  20%,80% { transform: translateX(3px); }
  30%,50%,70% { transform: translateX(-6px); }
  40%,60% { transform: translateX(6px); }
}
.card-eyebrow {
  font-family: var(--font-body);
  font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px;
}
.card-h2 {
  font-family: var(--font-display);
  font-size: 26px; font-weight: 800; letter-spacing: -.7px; line-height: 1.1;
  color: #fff; margin-bottom: 6px;
}
.card-sub { font-size: 13.5px; color: var(--muted-light); margin-bottom: 28px; line-height: 1.5; }

.field { margin-bottom: 16px; }
.field-label {
  display: block;
  font-size: 12px; font-weight: 600; letter-spacing: .04em;
  color: var(--muted-light);
  margin-bottom: 8px;
}
.input-wrap { position: relative; }
.input-wrap input {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 13px 44px 13px 44px;
  font-family: var(--font-body);
  font-size: 14px; color: #fff;
  outline: none;
  transition: border-color .18s, box-shadow .18s, background .18s;
}
.input-wrap input::placeholder { color: #3b4256; }
.input-wrap input:hover { border-color: #2a3247; }
.input-wrap input:focus { border-color: rgba(255,249,62,.35); box-shadow: 0 0 0 3px rgba(255,249,62,.08); background: #0e1119; }
.input-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px;
  color: #4a5468;
  pointer-events: none;
  transition: color .15s;
}
.input-wrap input:focus ~ .input-icon { color: var(--accent); }
.toggle-pw {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  color: #4a5468;
  border-radius: 6px;
  transition: color .15s, background .15s;
}
.toggle-pw:hover { color: #fff; background: rgba(255,255,255,.04); }
.toggle-pw svg { width: 16px; height: 16px; }

.error-msg {
  font-size: 12.5px; color: #f87171;
  background: rgba(248,113,113,.06);
  border: 1px solid rgba(248,113,113,.18);
  border-radius: 10px;
  padding: 0;
  height: 0; overflow: hidden;
  transition: padding .15s, height .15s, margin .15s;
}
.error-msg:not(:empty) { padding: 10px 14px; height: auto; margin-bottom: 14px; }

.btn-primary {
  width: 100%;
  font-family: var(--font-display);
  font-size: 14.5px; font-weight: 700;
  color: #080a0f;
  background: var(--accent);
  padding: 14px 24px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .14s, box-shadow .2s, filter .15s;
  margin-bottom: 6px;
  position: relative;
  overflow: hidden;
}
.btn-primary:hover { box-shadow: 0 0 32px var(--accent-glow); filter: brightness(1.06); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-primary .spinner {
  display: none;
  width: 16px; height: 16px;
  border: 2px solid rgba(8,10,15,.25);
  border-top-color: #080a0f;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
.btn-primary.loading .spinner { display: block; }
.btn-primary.loading .btn-label { opacity: .7; }
@keyframes spin { to { transform: rotate(360deg); } }

.auth-divider {
  display: flex; align-items: center; gap: 14px;
  font-size: 11px; color: var(--muted);
  letter-spacing: .14em; text-transform: uppercase;
  margin: 22px 0 16px;
}
.auth-divider::before, .auth-divider::after {
  content: ""; flex: 1; height: 1px; background: var(--border);
}
.auth-footer {
  text-align: center;
  font-size: 13.5px; color: var(--muted-light);
}
.auth-footer a { color: var(--accent); font-weight: 600; transition: color .15s; }
.auth-footer a:hover { color: #fff; }

/* status row beneath card */
.auth-status {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  font-size: 12px; color: var(--muted);
  margin-top: 4px;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-dot.green { background: var(--green); box-shadow: 0 0 8px rgba(74,222,128,.45); }
.status-dot.yellow { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.status-sep { width: 3px; height: 3px; border-radius: 50%; background: #232a3d; }
.status-item { display: flex; align-items: center; gap: 6px; }

/* Responsive */
@media (max-width: 600px) {
  .auth-card { padding: 28px 22px 26px; border-radius: 20px; }
  .auth-shell { padding: 100px 18px 56px; }
}
img.emoji { height: 1.15em; width: 1.15em; margin: 0 .05em; vertical-align: -0.15em; }
</style>
<script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="bg-art"></div>

<!-- ── Site nav (no Login button — we're on it) ── -->
<nav class="nav-root" id="mainNav">
  <a href="/" class="nav-logo">
    <img src="/Fortized icon.png" alt="Fortized" onerror="this.style.display='none'">
    <span class="nav-logo-word">Fortized</span>
  </a>
  <div class="nav-pill-group">
    <a href="/newsroom" class="nav-pill">Newsroom</a>
    <a href="/support" class="nav-pill">Support</a>
    <a href="/download" class="nav-pill">Download</a>
    <a href="/legal" class="nav-pill">Legal</a>
  </div>
  <div class="nav-sep"></div>
  <div class="nav-spacer"></div>
  <div class="nav-right">
    <a href="/signup" class="nav-btn-cta">Create account &rarr;</a>
  </div>
</nav>

<main class="auth-shell">

  <!-- ── Single centered form card ── -->
  <section class="auth-pane-form">
    <div class="auth-card" id="authCard">
      <div class="card-eyebrow">Sign in</div>
      <h2 class="card-h2">Welcome back.</h2>
      <p class="card-sub">Sign in with your username or email to pick up where you left off.</p>

      <div class="field">
        <label class="field-label" for="identifier">Username or email</label>
        <div class="input-wrap">
          <input type="text" id="identifier" placeholder="username or email" autocomplete="username">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="5" r="3.25"/><path d="M2.5 14.5c0-3 2.5-4.5 5.5-4.5s5.5 1.5 5.5 4.5"/>
          </svg>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 016 0v2"/>
          </svg>
          <button type="button" class="toggle-pw" id="togglePw" tabindex="-1" aria-label="Toggle password visibility">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z"/>
              <circle cx="8" cy="8" r="2"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="error" class="error-msg"></div>

      <button class="btn-primary" id="loginBtn">
        <div class="spinner"></div>
        <span class="btn-label">Sign in</span>
      </button>

      <div class="auth-divider">or</div>

      <div class="auth-footer">Don't have an account? <a href="/signup">Create one free</a></div>
    </div>

    <div class="auth-status">
      <div class="status-item"><span class="status-dot green"></span>Systems online</div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/FortizedSocial-supabase.js?v=20260430e"></script>
<script src="/firebase-compat-shim.js?v=20260430e"></script>
<script>
const loginBtn        = document.getElementById('loginBtn');
const identifierInput = document.getElementById('identifier');
const passwordInput   = document.getElementById('password');
const errorDiv        = document.getElementById('error');
const authCard        = document.getElementById('authCard');

// Already logged in → go straight to app
const existing = localStorage.getItem('ftz_current') || localStorage.getItem('fortized_current_user');
if (existing) window.location.href = '/app';

// Password visibility toggle
const togglePw = document.getElementById('togglePw');
togglePw.addEventListener('click', () => {
  const isPassword = passwordInput.type === 'password';
  passwordInput.type = isPassword ? 'text' : 'password';
  togglePw.innerHTML = isPassword
    ? '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z"/><line x1="2" y1="14" x2="14" y2="2"/></svg>'
    : '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>';
});

// Enter key submission
[identifierInput, passwordInput].forEach(el =>
  el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); })
);
loginBtn.addEventListener('click', doLogin);

async function doLogin() {
  // Trim both identifier AND password — copy-paste from password managers and
  // mobile keyboards regularly adds trailing whitespace and silently breaks
  // login with a generic "Wrong password" error.
  const id   = identifierInput.value.trim();
  const pass = passwordInput.value.trim();
  errorDiv.textContent = '';
  if (!id || !pass) { errorDiv.textContent = 'Please fill in all fields.'; return; }

  setLoading(true);
  try {
    const result = await FortizedSocial.login(id, pass);
    if (!result.ok) {
      errorDiv.textContent = result.msg;
      setLoading(false);
      authCard.classList.remove('shake');
      void authCard.offsetWidth;
      authCard.classList.add('shake');
      return;
    }

    const user = result.user;
    if (user?.username) {
      localStorage.setItem('ftz_current', user.username);
      localStorage.setItem('fortized_current_user', user.username);
      localStorage.setItem('ftz_user_' + user.username, JSON.stringify(user));
    }

    window.location.href = '/app';

  } catch (err) {
    console.error('Login error:', err);
    errorDiv.textContent = 'Connection error. Check your internet and try again.';
    setLoading(false);
  }
}

function setLoading(on) {
  loginBtn.disabled = on;
  loginBtn.classList.toggle('loading', on);
}
</script>
<script>(()=>{const n=document.getElementById('mainNav');if(!n)return;window.addEventListener('scroll',()=>n.classList.toggle('scrolled',window.scrollY>40),{passive:true});if(window.scrollY>40)n.classList.add('scrolled');})();</script>
