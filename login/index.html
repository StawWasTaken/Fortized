<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Fortized</title>
<meta name="description" content="Sign in to rejoin your Bastions and squad on Fortized.">
<meta name="theme-color" content="#fff93e">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fortized">
<meta property="og:title" content="Login – Fortized">
<meta property="og:description" content="Sign in to rejoin your Bastions and squad on Fortized.">
<meta property="og:image" content="https://fortized.com/Fortized banner.png">
<meta property="og:url" content="https://fortized.com/login">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Login – Fortized">
<meta name="twitter:description" content="Sign in to rejoin your Bastions and squad on Fortized.">
<meta name="twitter:image" content="https://fortized.com/Fortized banner.png">
<link rel="icon" type="image/png" href="/Fortized icon.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
::selection{background:rgba(255,249,62,.2);}
:root{--accent:#fff93e;--accent-dim:rgba(255,249,62,.1);--accent-mid:rgba(255,249,62,.2);--accent-glow:rgba(255,249,62,.4);--bg:#060810;--panel:rgba(10,13,20,.82);--border:#151b2a;--border-hover:#1e2840;--input-bg:rgba(6,8,14,.7);--radius:14px;--muted:#4a5568;--muted-light:#7d8a9e;--green:#3ecf6e;--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}img{-webkit-user-drag:none;user-select:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;}
html,body{height:100%;}
body{background:var(--bg);font-family:var(--font-body);color:white;overflow-x:hidden;display:flex;align-items:center;justify-content:center;}

/* ── Immersive background ── */
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;}
.bg-layer::before{content:"";position:absolute;inset:0;background:url("/Fortized banner.png") center/cover no-repeat;opacity:.06;filter:blur(2px) saturate(0.5);}
.bg-layer::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(255,249,62,.04),transparent 70%),radial-gradient(ellipse 60% 50% at 80% 20%,rgba(96,165,250,.03),transparent 60%),linear-gradient(180deg,rgba(6,8,16,0) 0%,rgba(6,8,16,.5) 60%,var(--bg) 100%);}

/* Grid overlay */
.bg-grid{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(255,249,62,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,249,62,.012) 1px,transparent 1px);background-size:64px 64px;pointer-events:none;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 0%,transparent 100%);}

/* Floating particles */
.particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.particle{position:absolute;border-radius:50%;opacity:0;animation:particleFloat linear infinite;}
.particle:nth-child(1){width:3px;height:3px;background:var(--accent);left:15%;top:80%;animation-duration:12s;animation-delay:0s;}
.particle:nth-child(2){width:2px;height:2px;background:rgba(255,249,62,.6);left:35%;top:90%;animation-duration:15s;animation-delay:2s;}
.particle:nth-child(3){width:4px;height:4px;background:rgba(255,249,62,.3);left:65%;top:85%;animation-duration:18s;animation-delay:4s;}
.particle:nth-child(4){width:2px;height:2px;background:rgba(96,165,250,.5);left:80%;top:95%;animation-duration:14s;animation-delay:1s;}
.particle:nth-child(5){width:3px;height:3px;background:rgba(255,249,62,.4);left:50%;top:88%;animation-duration:16s;animation-delay:3s;}
.particle:nth-child(6){width:2px;height:2px;background:rgba(62,207,110,.4);left:25%;top:92%;animation-duration:20s;animation-delay:5s;}
.particle:nth-child(7){width:3px;height:3px;background:rgba(255,249,62,.25);left:72%;top:78%;animation-duration:13s;animation-delay:6s;}
.particle:nth-child(8){width:2px;height:2px;background:rgba(255,249,62,.5);left:90%;top:86%;animation-duration:17s;animation-delay:2.5s;}
@keyframes particleFloat{0%{transform:translateY(0) translateX(0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(-100vh) translateX(20px);opacity:0;}}

/* Ambient glow orbs */
.glow-orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(80px);z-index:0;}
.glow-orb-1{width:400px;height:400px;background:rgba(255,249,62,.025);top:-10%;left:-5%;animation:orbFloat1 20s ease-in-out infinite;}
.glow-orb-2{width:350px;height:350px;background:rgba(96,165,250,.02);bottom:-10%;right:-5%;animation:orbFloat2 25s ease-in-out infinite;}
.glow-orb-3{width:300px;height:300px;background:rgba(255,249,62,.015);top:40%;right:10%;animation:orbFloat3 18s ease-in-out infinite;}
@keyframes orbFloat1{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,40px);}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-30px);}}
@keyframes orbFloat3{0%,100%{transform:translate(0,0);}50%{transform:translate(-30px,50px);}}

/* ── Main layout ── */
.auth-container{position:relative;z-index:10;width:100%;max-width:460px;padding:24px;display:flex;flex-direction:column;align-items:center;}

/* Branding */
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:36px;animation:fadeDown .6s cubic-bezier(.22,1,.36,1) both;}
.auth-brand-logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.auth-brand-logo img{height:40px;width:40px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(255,249,62,.2));}
.auth-brand-logo span{font-family:var(--font-display);font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px;}
.auth-tagline{font-size:13px;color:var(--muted-light);letter-spacing:.03em;}

/* Card */
.auth-card{width:100%;background:var(--panel);border-radius:20px;border:1px solid var(--border);backdrop-filter:blur(40px) saturate(1.3);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03) inset,0 1px 0 rgba(255,255,255,.04) inset;overflow:hidden;animation:revealUp .5s cubic-bezier(.22,1,.36,1) .1s both;position:relative;}
.auth-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(255,249,62,.3) 50%,transparent 95%);}
@keyframes revealUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.shake{animation:shake .35s ease both;}

.auth-card-body{padding:36px 40px 40px;}

/* Header */
.auth-header{margin-bottom:28px;text-align:center;}
.auth-header h1{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.5px;color:#fff;margin-bottom:6px;}
.auth-header h1 em{font-style:normal;color:var(--accent);}
.auth-header p{font-size:13.5px;color:var(--muted-light);line-height:1.6;}

/* Cloud login section */
.cloud-section{margin-bottom:12px;}
.cloud-section p{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;}

/* Primary button */
.btn-primary{width:100%;padding:14px;background:var(--accent);color:#080a0f;border:none;border-radius:var(--radius);font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.02em;cursor:pointer;transition:box-shadow .25s,transform .1s,filter .15s;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;}
.btn-primary::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 50%);opacity:0;transition:opacity .25s;}
.btn-primary:hover:not(:disabled)::before{opacity:1;}
.btn-primary:hover:not(:disabled){box-shadow:0 0 40px var(--accent-glow),0 4px 20px rgba(255,249,62,.15);filter:brightness(1.05);}
.btn-primary:active:not(:disabled){transform:scale(.98);}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;}

.btn-secondary{width:100%;padding:12px;background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:var(--radius);font-family:var(--font-display);font-size:14px;font-weight:700;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-secondary:hover{background:rgba(255,249,62,.08);box-shadow:0 0 20px rgba(255,249,62,.1);}
.btn-secondary:active{transform:scale(.98);}

/* Divider */
.auth-divider{display:flex;align-items:center;gap:14px;margin:24px 0;color:#1e2538;font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);}

/* Footer */
.auth-footer{text-align:center;font-size:13px;color:var(--muted);margin-top:4px;}
.auth-footer a{color:var(--accent);text-decoration:none;font-weight:600;transition:color .15s;}
.auth-footer a:hover{text-decoration:underline;}

/* Status bar at bottom */
.auth-status{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:28px;animation:fadeDown .6s cubic-bezier(.22,1,.36,1) .3s both;}
.status-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500;}
.status-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.status-dot.green{background:var(--green);box-shadow:0 0 8px rgba(62,207,110,.5);}
.status-dot.yellow{background:var(--accent);box-shadow:0 0 8px rgba(255,249,62,.4);}
.status-sep{width:1px;height:12px;background:#1a2030;}

/* ── Responsive ── */
@media(max-width:540px){
  .auth-card-body{padding:28px 24px 32px;}
  .auth-brand{margin-bottom:28px;}
  .auth-status{flex-direction:column;gap:8px;}
  .status-sep{display:none;}
}
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg-layer"></div>
<div class="bg-grid"></div>
<div class="particles">
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div>
</div>
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>
<div class="glow-orb glow-orb-3"></div>

<div class="auth-container">

  <!-- Brand -->
  <div class="auth-brand">
    <a href="/" class="auth-brand-logo">
      <img src="/Fortized icon.png" alt="Fortized" onerror="this.style.display='none'">
      <span>Fortized</span>
    </a>
    <div class="auth-tagline">The fortress awaits your return.</div>
  </div>

  <!-- Card -->
  <div class="auth-card" id="authCard">
    <div class="auth-card-body">
      <div class="auth-header">
        <h1>Welcome <em>back</em></h1>
        <p>Sign in with your Swiftaw Cloud account.</p>
      </div>

      <!-- Cloud Login Section -->
      <div class="cloud-section">
        <button class="btn-primary" id="cloudLoginBtn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5m-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11m3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
          </svg>
          Sign in with Swiftaw Cloud
        </button>
      </div>

      <div class="auth-divider">or</div>

      <div class="auth-footer">
        Don't have a Swiftaw Cloud account? <a href="https://cloud.swiftaw.io/signup" target="_blank">Create one free</a>
      </div>
    </div>
  </div>

  <!-- Live status -->
  <div class="auth-status">
    <div class="status-item"><span class="status-dot green"></span>Systems online</div>
    <div class="status-sep"></div>
    <div class="status-item"><span class="status-dot yellow"></span>Cloud connected</div>
    <div class="status-sep"></div>
    <div class="status-item">Your Bastions are waiting</div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// FORTIZED × SWIFTAW CLOUD LOGIN
// ════════════════════════════════════════════════════════════════════════

const CLOUD_AUTH_URL = 'https://cloud.swiftaw.io/auth/link';
const FORTIZED_URL = 'https://fortized.com';
const REDIRECT_URI = `${FORTIZED_URL}/auth/cloud-callback`;

// Already logged in → go straight to app
const fortizedToken = localStorage.getItem('fortized_token');
const fortizedSubaccount = localStorage.getItem('fortized_subaccount_id');
if (fortizedToken && fortizedSubaccount) {
  window.location.href = '/app';
}

// Cloud Login Button
document.getElementById('cloudLoginBtn').addEventListener('click', () => {
  // Generate random state for CSRF protection
  const state = Math.random().toString(36).substring(7) + Date.now().toString(36);
  localStorage.setItem('cloud_auth_state', state);

  // Redirect to Cloud login
  const cloudUrl = new URL(CLOUD_AUTH_URL);
  cloudUrl.searchParams.set('product', 'fortized');
  cloudUrl.searchParams.set('redirect_uri', REDIRECT_URI);
  cloudUrl.searchParams.set('state', state);

  window.location.href = cloudUrl.toString();
});
</script>

</body>
</html>
