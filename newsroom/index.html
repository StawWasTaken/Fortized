<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Newsroom - Fortized</title>
<meta name="description" content="Latest news, updates, and announcements from Fortized."/>
<meta name="theme-color" content="#fff93e"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Fortized"/>
<meta property="og:title" content="Newsroom - Fortized"/>
<meta property="og:description" content="Latest news, updates, and announcements from Fortized."/>
<meta property="og:image" content="https://fortized.com/Fortized banner.png?v=2"/>
<meta property="og:url" content="https://fortized.com/newsroom"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Newsroom - Fortized"/>
<meta name="twitter:description" content="Latest news, updates, and announcements from Fortized."/>
<meta name="twitter:image" content="https://fortized.com/Fortized banner.png?v=2"/>
<link rel="icon" type="image/png" href="/Fortized icon2.png"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet"/>
<style>
::selection{background:rgba(255,249,62,.2);}
:root{
  --acc:#fff93e;--acc-dim:rgba(255,249,62,.08);--acc-b:rgba(255,249,62,.18);--acc-g:rgba(255,249,62,.3);
  --bg:#080a0f;--panel:#0c0f1a;--panel-r:#0f1220;--bd:rgba(255,255,255,.06);--bd2:#1a2030;
  --mu:#4a5568;--mu-l:#8b95a8;--tx:#c8d0dc;--nav-h:68px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
img{-webkit-user-drag:none;user-select:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#1e2535;border-radius:10px}

/* ── Nav (Clipode-unified) ── */
.nav{position:sticky;top:0;z-index:200;height:var(--nav-h);display:flex;align-items:center;padding:0 40px;background:rgba(8,10,15,.96);backdrop-filter:blur(28px) saturate(200%);border-bottom:1px solid rgba(255,255,255,.05)}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-right:32px}
.nav-logo img{height:28px;width:28px;object-fit:contain}
.nav-logo-word{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#fff;letter-spacing:-.5px}
.nav-pill-group{display:flex;align-items:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:4px;gap:1px}
.nav-pill{font-size:13.5px;font-weight:500;color:var(--mu-l);padding:7px 14px;border-radius:9px;transition:color .15s,background .15s}
.nav-pill:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-pill.active{color:var(--acc);background:var(--acc-dim)}
.nav-sp{flex:1}
.nav-btn{font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;color:#101010;background:var(--acc);padding:9px 20px;border-radius:10px;transition:.15s}
.nav-btn:hover{background:#ffe55c;box-shadow:0 0 20px var(--acc-g)}

/* ── Hero (Clipode-unified) ── */
.hero{padding:80px 72px 72px;position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.05)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(8,10,15,1) 40%,rgba(8,10,15,.84) 100%);z-index:1}
.hero-banner{position:absolute;inset:0;z-index:0}
.hero-banner img{width:100%;height:100%;object-fit:cover;opacity:.12}
.grid-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(255,249,62,.009) 1px,transparent 1px),linear-gradient(90deg,rgba(255,249,62,.009) 1px,transparent 1px);background-size:64px 64px}
.hero-glow{position:absolute;top:-120px;right:-80px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(255,249,62,.04) 0%,transparent 70%);animation:drift 11s ease-in-out infinite alternate;z-index:1;pointer-events:none}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(-60px,40px)}}
.hero-inner{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:40px}
.hero-left{max-width:560px}
.hero-breadcrumb{font-size:12px;color:var(--mu);margin-bottom:16px}
.hero-breadcrumb a{color:var(--mu-l);transition:.15s}.hero-breadcrumb a:hover{color:#fff}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);background:rgba(255,249,62,.06);border:1px solid rgba(255,249,62,.16);border-radius:100px;padding:5px 14px;margin-bottom:22px}
.hero-eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--acc)}
.hero h1{font-family:'Syne',sans-serif;font-size:58px;font-weight:800;letter-spacing:-2.5px;line-height:.96;margin-bottom:18px;color:#fff}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero-sub{font-size:15px;color:var(--mu-l);line-height:1.65;max-width:520px}
.hero-stats{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--bd);border-radius:16px;padding:24px 28px}
.hero-stat{text-align:center}
.hero-stat-num{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#fff;margin-bottom:2px}
.hero-stat-label{font-size:11px;color:var(--mu-l);letter-spacing:.06em}
.hero-stat-divider{width:1px;height:32px;background:var(--bd)}

/* ── Blog Content Area ── */
.blog-wrap{max-width:1100px;margin:0 auto;padding:48px 72px 80px}

/* ── Search ── */
.blog-search-wrap{position:relative;max-width:480px}
.blog-search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu);pointer-events:none}
.blog-search-input{width:100%;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:13px 18px 13px 44px;font-size:14px;color:var(--tx);outline:none;transition:border-color .18s,box-shadow .18s}
.blog-search-input:focus{border-color:rgba(255,249,62,.3);box-shadow:0 0 0 3px rgba(255,249,62,.06)}
.blog-search-input::placeholder{color:var(--mu)}

/* ── Pinned Card ── */
.pinned-card{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;transition:border-color .2s,box-shadow .2s;margin-bottom:32px}
.pinned-card:hover{border-color:rgba(255,249,62,.14);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pinned-card-img{min-height:240px;background:linear-gradient(145deg,rgba(255,249,62,.1) 0%,rgba(255,249,62,.02) 40%,transparent 70%),linear-gradient(to bottom,rgba(8,10,15,.1),rgba(8,10,15,.6)),url('/Fortized banner.png?v=2') center/cover}
.pinned-card-body{padding:28px;display:flex;flex-direction:column;gap:10px}
.pinned-badge{font-size:11px;font-weight:700;color:var(--acc);background:var(--acc-dim);border:1px solid var(--acc-b);border-radius:6px;padding:3px 10px;width:fit-content}
.pinned-card-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.2}
.pinned-card-excerpt{font-size:13.5px;color:var(--mu-l);line-height:1.6;flex:1}

/* ── Card Shared ── */
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:5px;padding:3px 8px}
.tag-rd{color:var(--acc);background:var(--acc-dim);border:1px solid var(--acc-b)}
.tag-announce{color:#60a5fa;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.18)}
.tag-launch{color:#4ade80;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.18)}
.tag-safety{color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.18)}
.card-date{font-size:12px;color:var(--mu)}
.card-readtime{font-size:11px;color:var(--mu)}
.author-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu-l);font-weight:500}
.author-chip-av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,rgba(255,249,62,.25),rgba(255,249,62,.06));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:10px;font-weight:800;color:var(--acc)}
.read-link{font-size:12px;font-weight:600;color:var(--acc);transition:.15s}

/* ── Featured Layout ── */
.featured-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:24px}
.hero-card{background:var(--panel);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.hero-card:hover{border-color:rgba(255,249,62,.14);box-shadow:0 16px 48px rgba(0,0,0,.4)}
.hero-card-img{height:200px;background:linear-gradient(145deg,rgba(255,249,62,.08) 0%,transparent 55%),linear-gradient(to bottom,rgba(8,10,15,.1),rgba(8,10,15,.7)),url('/Fortized banner.png?v=2') center/cover;position:relative;padding:14px}
.hero-card-body{padding:20px;display:flex;flex-direction:column;gap:8px}
.hero-card-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:#fff;letter-spacing:-.4px;line-height:1.2}
.hero-card-excerpt{font-size:13px;color:var(--mu-l);line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto}

.side-stack{display:flex;flex-direction:column;gap:16px}
.side-card{background:var(--panel);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .2s,box-shadow .2s;flex:1;display:flex;flex-direction:column}
.side-card:hover{border-color:rgba(255,249,62,.14);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.side-card-img{height:100px;background:linear-gradient(145deg,rgba(255,249,62,.06) 0%,transparent 55%),linear-gradient(to bottom,rgba(8,10,15,.1),rgba(8,10,15,.75)),url('/Fortized banner.png?v=2') center/cover}
.side-card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.side-card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.3px}
.side-card-excerpt{font-size:12px;color:var(--mu-l);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── Section Divider ── */
.section-divider{display:flex;align-items:center;gap:14px;margin:36px 0 20px}
.section-divider:first-of-type{margin-top:0}
.section-divider-label{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.section-divider-line{flex:1;height:1px;background:var(--bd)}

/* ── Regular Cards ── */
.secondary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.reg-card{background:var(--panel);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .2s,box-shadow .2s;display:flex;flex-direction:column}
.reg-card:hover{border-color:rgba(255,249,62,.14);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.reg-card-img{height:110px;background:linear-gradient(145deg,rgba(255,249,62,.06) 0%,transparent 55%),linear-gradient(to bottom,rgba(8,10,15,.1),rgba(8,10,15,.78)),url('/Fortized banner.png?v=2') center/cover}
.reg-card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.reg-card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.3px}
.reg-card-excerpt{font-size:12px;color:var(--mu-l);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.post-grid.search-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.blog-no-results{display:none;text-align:center;padding:60px 20px;font-size:15px;color:var(--mu-l)}
.blog-no-results span{font-size:32px;display:block;margin-bottom:12px}

/* ── Article View (refreshed) ── */
#article-view{display:none;max-width:820px;margin:0 auto;padding:48px 56px 100px}
#article-view.open{display:block}
#blog-list-view.hidden{display:none}
.article-back{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--mu-l);cursor:pointer;margin-bottom:32px;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:100px;border:1px solid #1a2030;background:rgba(255,255,255,.02);transition:.15s}
.article-back:hover{color:#fff;border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.article-full-banner{width:100%;min-height:300px;border-radius:24px;overflow:hidden;margin-bottom:34px;background:#0c0f1a center/cover no-repeat;border:1px solid #1a2030;position:relative;display:flex;align-items:flex-end;padding:36px;isolation:isolate}
.article-full-banner::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to top,rgba(8,10,15,.85),rgba(8,10,15,.1) 65%,transparent);z-index:0}
.banner-content{position:relative;z-index:1;width:100%}
.article-eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);background:rgba(255,249,62,.07);border:1px solid rgba(255,249,62,.18);border-radius:100px;padding:5px 12px;margin-bottom:14px}
.article-eyebrow::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc)}
.article-full-title{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;color:#fff;letter-spacing:-1.2px;line-height:1.05;margin-bottom:12px}
.article-full-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mu-l)}
.article-from-badge{display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acc);background:rgba(255,249,62,.07);border:1px solid rgba(255,249,62,.18);border-radius:100px;padding:3px 9px;margin-top:14px}
.article-byline{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(160deg,rgba(18,22,34,.95) 0%,rgba(10,13,20,.92) 100%);border:1px solid #1a2030;border-radius:18px;margin-bottom:44px;position:relative;isolation:isolate}
.article-byline::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 90% -20%,rgba(255,249,62,.10),transparent 55%);pointer-events:none;z-index:0}
.article-byline > *{position:relative;z-index:1}
.byline-av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,rgba(255,249,62,.25),rgba(255,249,62,.06));border:2px solid rgba(255,249,62,.28);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--acc);flex-shrink:0;overflow:hidden}
.byline-av img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.byline-info .byline-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:3px;letter-spacing:-.2px}
.byline-info .byline-role{font-size:12.5px;color:var(--mu-l)}
.byline-org{margin-left:auto;font-size:11.5px;color:var(--mu);letter-spacing:.04em}

/* ── Article Prose ── */
.article-prose{font-family:'Lora',serif}
.article-prose .lead{font-size:17.5px;color:#c8d0dc;line-height:1.8;margin-bottom:34px;padding-bottom:30px;border-bottom:1px solid var(--bd);font-style:italic}
.article-prose p{font-size:15.5px;color:var(--mu-l);line-height:1.9;margin-bottom:20px}
.article-prose h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.3px;color:#fff;margin:40px 0 14px;display:flex;align-items:center;gap:10px}
.article-prose h2::before{content:"";width:4px;height:20px;background:var(--acc);border-radius:2px;flex-shrink:0}
.article-prose ul{list-style:none;margin:14px 0 26px;display:flex;flex-direction:column;gap:9px}
.article-prose ul li{display:flex;align-items:flex-start;gap:12px;font-size:15px;color:var(--mu-l);line-height:1.65;font-family:'DM Sans',sans-serif;padding:13px 16px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:11px;transition:border-color .15s,background .15s}
.article-prose ul li:hover{border-color:rgba(255,249,62,.12);background:rgba(255,249,62,.03)}
.article-prose ul li::before{content:"✦";color:var(--acc);font-size:9px;flex-shrink:0;margin-top:5px}
.article-prose ul li strong{color:#fff;font-weight:600}
.article-prose .highlight-box{background:rgba(255,249,62,.04);border:1px solid rgba(255,249,62,.12);border-left:3px solid var(--acc);border-radius:13px;padding:18px 22px;margin:26px 0;font-size:14.5px;color:#c8d0dc;line-height:1.72;font-family:'DM Sans',sans-serif}
.article-prose .highlight-box strong{color:var(--acc)}
.article-prose .quote-block{position:relative;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-left:3px solid rgba(255,249,62,.35);border-radius:13px;padding:20px 24px 20px 30px;margin:26px 0;font-size:16px;font-style:italic;color:#c8d0dc;line-height:1.72}
.article-prose .quote-block::before{content:"\201C";position:absolute;top:6px;left:12px;font-size:38px;color:rgba(255,249,62,.2);font-family:'Lora',serif;line-height:1}
.radiance-badge-inline{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(90deg,rgba(255,200,62,.12),rgba(255,249,62,.1));border:1px solid rgba(255,220,62,.22);border-radius:100px;padding:2px 10px;font-size:13px;font-weight:700;color:#ffd93e;vertical-align:middle;font-family:'DM Sans',sans-serif}
.article-prose .perks-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0 26px}
.perk-card{background:var(--panel);border:1px solid var(--bd);border-radius:13px;padding:16px;display:flex;gap:11px;align-items:flex-start;transition:border-color .15s,background .15s}
.perk-card:hover{border-color:rgba(255,249,62,.14);background:rgba(255,249,62,.03)}
.perk-icon{font-size:20px;flex-shrink:0}
.perk-body .perk-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#fff;margin-bottom:3px}
.perk-body .perk-desc{font-size:12px;color:var(--mu-l);line-height:1.5;font-family:'DM Sans',sans-serif}
.article-prose .sign-off{color:var(--mu);font-size:13.5px;font-style:italic;border-top:1px solid var(--bd);padding-top:22px;margin-top:8px;font-family:'DM Sans',sans-serif}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .5s var(--ease) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.30s}

/* ── Footer (Clipode-unified) ── */
footer{border-top:1px solid rgba(255,255,255,.05);padding:36px 72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.footer-left{display:flex;align-items:center;gap:16px}
.footer-logo{display:flex;align-items:center;gap:10px}
.footer-logo img{height:22px;opacity:.45}
.footer-logo span{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#374151}
.footer-socials{display:flex;align-items:center;gap:10px;padding-left:6px;border-left:1px solid rgba(255,255,255,.06)}
.footer-socials a{color:#374151;transition:color .2s;display:flex;align-items:center}
.footer-socials a:hover{color:var(--mu-l)}
footer .copy{font-size:12px;color:#2d3548;text-align:center}
.footer-links{display:flex;gap:20px;justify-content:flex-end}
.footer-links a{font-size:12px;color:#374151;transition:color .15s}
.footer-links a:hover{color:var(--mu-l)}

/* ── Responsive ── */
@media(max-width:1024px){
  .featured-row{grid-template-columns:1fr}
  .side-stack{flex-direction:row}
  .secondary-row{grid-template-columns:1fr 1fr}
  .post-grid.search-grid{grid-template-columns:1fr 1fr}
  .pinned-card{grid-template-columns:1fr}
  .pinned-card-img{min-height:200px}
}
@media(max-width:900px){
  .nav-pill-group{display:none}
}
@media(max-width:768px){
  .nav{padding:0 20px}
  .hero{padding:56px 24px 44px}.hero h1{font-size:40px}

/* ── Page redesign overlay — match homepage bubble cards ── */
/* Cardified surfaces */
.pinned-card, .hero-card, .side-card, .reg-card,
.help-card, .kb-card, .contact-card, .status-card,
.doc-row, .article-byline, .faq {
  background: linear-gradient(160deg, rgba(18,22,34,.95) 0%, rgba(10,13,20,.92) 100%);
  border: 1px solid #1a2030;
  position: relative;
  isolation: isolate;
  transition: transform .35s cubic-bezier(.22,1,.36,1), border-color .25s, box-shadow .35s;
}
.pinned-card, .hero-card, .side-card, .reg-card,
.help-card, .kb-card, .contact-card, .status-card,
.article-byline { border-radius: 22px; }
.faq { border-radius: 16px; margin-bottom: 10px; }
.doc-row { border-radius: 22px; padding: 24px 26px; border-bottom: none !important; }

/* Subtle accent radial in top-right */
.pinned-card::before, .hero-card::before, .side-card::before, .reg-card::before,
.help-card::before, .kb-card::before, .contact-card::before, .doc-row::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(circle at 80% -10%, rgba(255,249,62,.10), transparent 55%);
  pointer-events: none; z-index: 0;
}
.pinned-card > *, .hero-card > *, .side-card > *, .reg-card > *,
.help-card > *, .kb-card > *, .contact-card > *, .doc-row > * { position: relative; z-index: 1; }

/* Hover lift + accent edge */
.pinned-card:hover, .hero-card:hover, .side-card:hover, .reg-card:hover,
.help-card:hover, .kb-card:hover, .doc-row:hover {
  border-color: rgba(255,249,62,.22);
  box-shadow: 0 28px 70px rgba(0,0,0,.55), 0 0 50px rgba(255,249,62,.06);
  transform: translateY(-4px);
}
.doc-row:hover { padding-left: 26px !important; padding-right: 26px !important; background: linear-gradient(160deg, rgba(22,26,40,.95) 0%, rgba(13,16,26,.92) 100%); }

/* doc-list gap so cards breathe */
.doc-list { display: flex; flex-direction: column; gap: 14px; }

/* Hero — match homepage scale + accent em */
.hero h1 { font-family: 'Syne', sans-serif; font-size: 60px; font-weight: 800; letter-spacing: -2.4px; line-height: .96; color: #fff; }
.hero h1 em { font-style: normal; color: #fff93e; }
.hero-sub { font-size: 16px; }

/* Section heading with accent bar */
h2.section-h, .section-h {
  font-family: 'Syne', sans-serif;
  font-size: 30px; font-weight: 800; letter-spacing: -.9px;
  color: #fff;
  display: inline-flex; align-items: center; gap: 14px;
  margin-bottom: 24px;
}
h2.section-h::before, .section-h::before {
  content: ""; width: 22px; height: 2px; background: #fff93e;
  border-radius: 2px;
}
.hub-section-label {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
  color: #fff93e !important;
  border-bottom: none !important;

}
.hub-section-label::before {
  content: ""; width: 18px; height: 1.5px; background: #fff93e;
}

/* CTA buttons */
.nav-btn, .submit-btn {
  background: #fff93e; color: #0a0d14;
  font-family: 'Syne', sans-serif; font-weight: 700;
}

/* Modal panel — bubble look */
.modal { border-radius: 24px; background: linear-gradient(160deg, rgba(18,22,34,.95), rgba(10,13,20,.92)); }

@media (max-width: 768px) {

    content:`<p class="lead">A letter to the community. As we close out Q1, I want to share where Fortized is going — and what you can expect from us in the months ahead.</p><p>When we launched Fortized, we had a vision: build a platform where communities are sovereign, identity is earned, and nobody has to pay to belong. That vision hasn't changed — it's only grown sharper.</p><h2>What We've Built So Far</h2><p>In just a few months, we've shipped Bastions 2.0, a complete Atelier economy, the Desktop app, Living Bastions with mood and reputation systems, and a full safety infrastructure led by our Security Department. That's a lot of ground covered in a short time.</p><h2>What's Coming Next</h2><ul><li><strong>Mobile App (iOS & Android)</strong> — Native apps are in active development. Expect a beta this summer.</li><li><strong>Voice & Video Overhaul</strong> — We're rebuilding Party Rooms from the ground up with spatial audio and screen sharing.</li><li><strong>Bastion Discovery</strong> — A curated directory to find public Bastions by interest, game, and community type.</li><li><strong>Creator Tools</strong> — Streaming integration, subscriber channels, and monetisation features for content creators.</li><li><strong>API v2</strong> — A complete developer platform with webhooks, bot hosting, and marketplace.</li></ul><div class="highlight-box"><strong>Community-first, always.</strong> Every feature we ship is designed to strengthen communities — not extract value from them.</div><p>We're still small. We're still scrappy. But we're building something that matters. Thank you for being part of this fortress.</p><p class="sign-off">— Staw, Chief Executive Officer · Swiftaw</p>`
  },
  encryption_update: {
    category:'Security', date:'March 17, 2025', readTime:'6 min read',
    authorInitial:'W', authorPillLabel:'Swiftaw Safety Department',
    title:'End-to-End Encryption: Our Approach to Private Messaging', bylineName:'Weaverdant',
    bylineRole:'Chief Security Officer, Swiftaw',
    tagClass:'tag-safety', tagLabel:'Security',
    banner:'/FortNovelHeader.png',
    content:`<p class="lead">Privacy isn't a feature — it's a foundation. Today I want to walk through how Fortized handles encryption, what we're building next, and what our commitments are to your data.</p><h2>How DMs Work Today</h2><p>Direct messages on Fortized are encrypted in transit using TLS 1.3. Messages stored on-device use browser localStorage with no server-side persistence in the current architecture. This means your conversations never leave your machine unless you explicitly share them.</p><h2>What We're Building</h2><p>As we transition to server-backed infrastructure, we're implementing full end-to-end encryption for direct messages. This means:</p><ul><li><strong>Only you and the recipient can read messages</strong> — not Fortized, not Swiftaw, not anyone else</li><li><strong>Forward secrecy</strong> — each message session uses ephemeral keys, so compromising one session doesn't expose others</li><li><strong>Verified identities</strong> — users can verify each other's encryption keys to prevent impersonation</li><li><strong>Zero-knowledge architecture</strong> — we cannot decrypt your messages even if compelled to</li></ul><div class="highlight-box"><strong>Your messages are yours.</strong> We designed our system so that we literally cannot read your private conversations. That's not a policy — it's a technical guarantee.</div><h2>Bastion Messages</h2><p>Community channels in Bastions use a different model. Since these are shared spaces, messages are encrypted in transit but readable by authorised moderators and admins. This is necessary for content moderation and community safety — but we're transparent about it.</p><h2>Third-Party Auditing</h2><p>We're in the process of engaging an independent security firm to audit our encryption implementation. Results will be published publicly. We believe transparency in security is just as important as the security itself.</p><p class="sign-off">— Weaverdant, Chief Security Officer · Swiftaw Safety Department</p>`
  },
  game_detection: {
    category:'R&D', date:'March 15, 2025', readTime:'4 min read',
    authorInitial:'T', authorPillLabel:'Swiftaw R&D Department',
    title:'How Game Detection Works — Behind the Scenes', bylineName:'Tyrianum',
    bylineRole:'Chief Research & Development Officer, Swiftaw',
    tagClass:'tag-rd', tagLabel:'R&D',
    banner:'/FortNovelHeader.png',
    content:`<p class="lead">One of the most-loved features in Fortized Desktop is automatic game detection. Today I want to pull back the curtain on how it actually works.</p><h2>The Detection Pipeline</h2><p>When you launch the Fortized Desktop app, a lightweight process monitor runs in the background. It scans your running processes every 15 seconds, comparing them against our curated game database and IGDB's catalogue of over 200,000 titles.</p><ul><li><strong>Process Matching</strong> — We match executable names against known game binaries. No file content is ever read.</li><li><strong>IGDB Enrichment</strong> — When a match is found, we pull cover art, genre info, and metadata from IGDB to display on your profile.</li><li><strong>Privacy First</strong> — The process list never leaves your machine. Detection runs entirely client-side.</li></ul><h2>Cover Art Integration</h2><p>We partnered with IGDB to bring high-quality cover art to your game collection. When you add a game — whether manually or through detection — we fetch artwork automatically. This makes your profile's game collection look polished without any extra effort.</p><div class="highlight-box"><strong>Zero telemetry.</strong> Your running processes are never sent to our servers. Game detection is 100% local.</div><h2>What's Next</h2><p>We're working on time-tracking integration, so you can see how many hours you've spent in each game. We're also building a "Currently Playing" status that automatically updates when you launch a game — visible to your friends on the platform.</p><p class="sign-off">— Tyrianum, Chief Research & Development Officer · Swiftaw R&D Department</p>`
  },
  community_growth: {
    category:'Company', date:'March 12, 2025', readTime:'4 min read',
    authorInitial:'S', authorPillLabel:'Swiftaw',
    title:'Growing the Fortress — Our Community Philosophy', bylineName:'Staw',
    bylineRole:'Chief Executive Officer, Swiftaw',
    tagClass:'tag-announce', tagLabel:'Company',
    banner:'/FortNovelHeader.png',
    content:`<p class="lead">Communities are the heart of Fortized. Today I want to share how we think about growth — and why we do things differently.</p><h2>Quality Over Quantity</h2><p>We've seen what happens when platforms optimise for user count above all else. Communities get noisy. Moderation breaks down. Identity gets lost in the crowd. At Fortized, we measure success differently.</p><p>Our growth metrics focus on <strong>engagement depth</strong> — how many meaningful conversations happen, how many Bastions are actively moderated, how many members earn reputation through genuine participation.</p><h2>The Onyx Economy</h2><p>Our Onyx system is designed to make growth sustainable. When existing members invite new allies, both parties earn Onyx. This creates a natural incentive for bringing in people who will actually engage — not just inflate numbers.</p><ul><li><strong>Recruitment rewards</strong> — Earn Onyx for every friend who joins and stays active</li><li><strong>Daily engagement</strong> — Consistent participation earns daily Onyx bonuses</li><li><strong>Quest system</strong> — Community challenges that drive meaningful engagement</li></ul><div class="highlight-box"><strong>Growth that matters.</strong> We'd rather have 10,000 engaged members than 100,000 silent accounts.</div><h2>Partnerships</h2><p>We're actively building partnerships with gaming communities, content creators, and esports organisations. If you're interested in bringing your community to Fortized, reach out to us through our Support page.</p><p class="sign-off">— Staw, Chief Executive Officer · Swiftaw</p>`
  },
  security_audit: {
    category:'Security', date:'March 10, 2025', readTime:'5 min read',
    authorInitial:'W', authorPillLabel:'Swiftaw Safety Department',
    title:'Q1 Security Report — Protecting the Fortress', bylineName:'Weaverdant',
    bylineRole:'Chief Security Officer, Swiftaw',
    tagClass:'tag-safety', tagLabel:'Security',
    banner:'/FortNovelHeader.png',
    content:`<p class="lead">Transparency is a core value of the Swiftaw Safety Department. Here's our first quarterly security report — what we've done, what we've found, and what we're improving.</p><h2>Infrastructure Hardening</h2><p>Over the past quarter, we've made significant improvements to our security posture:</p><ul><li><strong>Content Security Policy</strong> — Strict CSP headers now prevent XSS attacks across all Fortized web properties</li><li><strong>Rate Limiting</strong> — API endpoints are now protected with intelligent rate limiting that adapts to traffic patterns</li><li><strong>Session Management</strong> — Sessions now expire after 30 days of inactivity and support forced revocation</li><li><strong>Input Sanitisation</strong> — All user inputs are sanitised at both client and server level</li></ul><h2>AutoMod Performance</h2><p>Since deploying AutoMod 2.0, we've seen significant improvements in automated moderation:</p><ul><li>Spam detection accuracy: 97.3%</li><li>Raid prevention: 12 attacks blocked in the first month</li><li>False positive rate: under 0.4%</li></ul><h2>Bug Bounty Programme</h2><p>We're launching a responsible disclosure programme for security researchers. If you find a vulnerability in Fortized, we want to hear about it — and we'll reward you for it.</p><div class="highlight-box"><strong>Security is everyone's job.</strong> We encourage all Bastion admins to enable AutoMod, use strong passwords, and report suspicious activity through the in-app reporting system.</div><h2>What's Next</h2><p>In Q2, we're focusing on two-factor authentication, login notifications, and advanced audit logging for Bastion owners. Your fortress will be even more defensible.</p><p class="sign-off">— Weaverdant, Chief Security Officer · Swiftaw Safety Department</p>`
  },
  performance: {
    category:'R&D', date:'March 7, 2025', readTime:'5 min read',
    authorInitial:'T', authorPillLabel:'Swiftaw R&D Department',
    title:'Under the Hood — Performance Improvements in March', bylineName:'Tyrianum',
    bylineRole:'Chief Research & Development Officer, Swiftaw',
    tagClass:'tag-rd', tagLabel:'R&D',
    banner:'/FortNovelHeader.png',
    content:`<p class="lead">Speed matters. This month, we shipped a series of performance optimisations that make Fortized feel significantly faster. Here's a technical overview of what we changed and why.</p><h2>Rendering Pipeline</h2><p>We rebuilt the message rendering pipeline to use virtual scrolling. Previously, all visible messages were rendered as DOM nodes. Now, only messages in the viewport (plus a buffer of 20 above and below) are rendered. The result:</p><ul><li><strong>70% reduction</strong> in DOM node count for channels with 1000+ messages</li><li><strong>Smooth 60fps scrolling</strong> even in the busiest Bastions</li><li><strong>Lower memory usage</strong> — particularly noticeable on devices with limited RAM</li></ul><h2>Asset Loading</h2><p>Profile pictures, cover art, and emoji are now loaded with intersection observers — meaning they only fetch when they're about to become visible. Combined with aggressive caching, this reduces initial load times by approximately 40%.</p><h2>WebSocket Optimisation</h2><p>Our real-time messaging layer now uses binary WebSocket frames instead of JSON text frames. This reduces bandwidth per message by roughly 35% and improves parsing speed on the client.</p><div class="highlight-box"><strong>Engineering philosophy:</strong> We don't add features and worry about performance later. We optimise continuously so the platform stays fast as it grows.</div><h2>The Atelier</h2><p>The Atelier shop now uses lazy rendering for item grids. Shop categories load on demand, and appearance previews are generated using CSS custom properties instead of full re-renders. The shop opens 3x faster than before.</p><p class="sign-off">— Tyrianum, Chief Research & Development Officer · Swiftaw R&D Department</p>`
  },
  data_protection: {
    category:'Security', date:'March 4, 2025', readTime:'4 min read',
    authorInitial:'W', authorPillLabel:'Swiftaw Safety Department',
    title:'Your Data, Your Rules — How We Handle Privacy', bylineName:'Weaverdant',
    bylineRole:'Chief Security Officer, Swiftaw',
    tagClass:'tag-safety', tagLabel:'Security',
    banner:'/FortNovelHeader.png',
    content:`<p class="lead">Data privacy isn't just a checkbox for us — it's embedded in every decision we make. Here's exactly how Fortized handles your personal information.</p><h2>What We Collect</h2><p>Fortized collects the minimum data necessary to provide the service:</p><ul><li><strong>Account data</strong> — username, email, display name, and password (hashed, never stored in plain text)</li><li><strong>Profile data</strong> — avatar, bio, pronouns, connections, and customisation preferences</li><li><strong>Activity data</strong> — Bastion memberships, friends list, and message metadata</li><li><strong>Technical data</strong> — browser type, session tokens, and error logs</li></ul><h2>What We Don't Collect</h2><ul><li>We don't track your browsing outside of Fortized</li><li>We don't sell or share data with advertisers</li><li>We don't use data for targeted advertising</li><li>We don't read your DMs — ever</li></ul><h2>Local-First Architecture</h2><p>In the current architecture, most user data lives in your browser's localStorage. This gives you direct control — you can inspect, export, or delete your data at any time through your browser's developer tools or through your Fortized account settings.</p><div class="highlight-box"><strong>Compliant everywhere.</strong> Our data practices are designed to comply with privacy regulations in every jurisdiction where Fortized is available, including GDPR, CCPA, and LGPD.</div><h2>Your Rights</h2><p>Regardless of where you live, you have the right to access your data, correct inaccuracies, request deletion, and export a copy. These rights are available through your account settings or by contacting our support team.</p><p class="sign-off">— Weaverdant, Chief Security Officer · Swiftaw Safety Department</p>`
  },
  atelier_evolution: {
    category:'R&D', date:'March 1, 2025', readTime:'4 min read',
    authorInitial:'T', authorPillLabel:'Swiftaw R&D Department',
    title:'The Atelier Evolves — New Themes, Decorations & Effects', bylineName:'Tyrianum',
    bylineRole:'Chief Research & Development Officer, Swiftaw',
    tagClass:'tag-rd', tagLabel:'R&D',
    banner:'/Onyx banner.png',
    content:`<p class="lead">The Atelier is growing. Today we're shipping a wave of new content and features that expand what you can do with your Fortized identity.</p><h2>New Appearance Themes</h2><p>Two new appearance themes join the shop today:</p><ul><li><strong>Sunset</strong> — A warm gradient from deep plum to golden amber. Watch the sun set over your fortress as warm tones blend through every panel and sidebar.</li><li><strong>Kingdom of God</strong> — Our first light theme. White and gold with divine elegance. A radiant experience for those who prefer light mode done right.</li></ul><p>Both themes are available in the Atelier shop for Onyx. They join our existing collection of Onyx Pure, Midnight Citadel, and Dark Realm.</p><h2>Avatar Decorations</h2><p>Profile decorations are now available — animated frames that surround your avatar, visible across all of Fortized. Launch decorations include seasonal frames, achievement badges, and exclusive designs for early supporters.</p><h2>Display Name Styles</h2><p>We've unlocked display name customisation for everyone — not just Radiance members. You can now choose your font, colour, and effect. Available effects include Solid, Gradient, Neon, Toon, and Pop. Your chosen style appears everywhere: in chat, on your profile, and on your nameplate.</p><div class="highlight-box"><strong>Free for everyone.</strong> Display name styles are not locked behind any paywall. We believe self-expression should be accessible to all.</div><h2>Profile Widgets</h2><p>Your profile card now supports widgets — modular sections that showcase your interests. Launch widgets include Games I Like, Favourite Game, Games in Rotation, Primary Bastion, and Spotify integration. More widgets are coming soon.</p><p class="sign-off">— Tyrianum, Chief Research & Development Officer · Swiftaw R&D Department</p>`
  },
  milestone_launch: {
    category:'Company', date:'February 29, 2025', readTime:'3 min read',
    authorInitial:'S', authorPillLabel:'Swiftaw',
    title:'From Zero to Fortress — Our Journey So Far', bylineName:'Staw',
    bylineRole:'Chief Executive Officer, Swiftaw',
    tagClass:'tag-launch', tagLabel:'Company',
    banner:'/FortNovelHeader.png',
    content:`<p class="lead">Every fortress starts with a single stone. Here's how Fortized went from an idea to a living platform.</p><h2>The Beginning</h2><p>Fortized started as a conversation between friends frustrated with existing platforms. We wanted something that put communities first — not advertisers, not shareholders, not algorithms. Just people building spaces together.</p><p>The name "Fortized" comes from "fortified" — because we believe communities should be strong, defensible, and owned by the people who build them. That's why we call servers "Bastions." That's why admins have complete sovereignty. That's why our economy is earned, not bought.</p><h2>Key Milestones</h2><ul><li><strong>Concept & Design</strong> — Architecture planning, UI design language, brand identity</li><li><strong>Core Platform</strong> — Bastions, channels, roles, messaging, friend system</li><li><strong>The Atelier</strong> — Onyx economy, Radiance system, cosmetic marketplace</li><li><strong>Safety Infrastructure</strong> — AutoMod, raid protection, reporting system</li><li><strong>Desktop App</strong> — Native desktop client for Windows, macOS, and Linux</li><li><strong>Living Bastions</strong> — Mood, reputation, Joyster, focus mode</li></ul><div class="highlight-box"><strong>Built by the community, for the community.</strong> Every feature request, bug report, and piece of feedback during Beta has directly shaped what Fortized is today.</div><h2>Thank You</h2><p>To everyone who joined early, tested features, reported bugs, and helped shape this platform — thank you. You're not just users. You're builders. And the fortress is stronger because of you.</p><p>We're just getting started.</p><p class="sign-off">— Staw, Chief Executive Officer · Swiftaw</p>`
  },
  desktop: {
    category:'Announcement', date:'March 3, 2026', readTime:'3 min read',
    authorInitial:'S', authorPillLabel:'Swiftaw',
    title:'The Fortress Comes to Your Desktop', bylineName:'Staw',
    bylineRole:'Chief Executive Officer, Swiftaw',
    tagClass:'tag-announce', tagLabel:'Announcement',
    banner:'/Fortized banner5.png',
    content:`<p class="lead">Today we're making Fortized available as a dedicated desktop application — and it's been one of the most requested features since day one. The Fortress now lives on your machine.</p><p>Since the Beta launched, we've heard the same request over and over: "When can I get Fortized as a real app?" The browser works, but a native experience is something else entirely. So we built it.</p><h2>Why Desktop?</h2><p>The web client will always be there. But a desktop app means Fortized starts when your PC starts. It means system-level notifications that actually work. It means less RAM overhead, faster load times, and the kind of responsiveness you expect from software that lives on your taskbar — not in a browser tab.</p><p>This isn't an Electron wrapper around the website. We went deeper. The desktop client is built to take full advantage of your system while keeping the same seamless experience you already know from the web.</p><h2>What You Get</h2><ul><li><strong>System Tray Integration</strong> — Fortized sits in your tray, ready when you are. Minimize to tray, receive notifications, and jump back in instantly.</li><li><strong>Native Notifications</strong> — OS-level push notifications for mentions, DMs, and Bastion alerts. No more missed messages because you forgot a browser tab.</li><li><strong>Auto-Updates</strong> — The app keeps itself current. Every patch, every feature drop — delivered silently in the background.</li><li><strong>Hardware Acceleration</strong> — Smoother scrolling, faster rendering, and lower CPU usage compared to the browser client.</li><li><strong>Startup Launch</strong> — Option to launch Fortized automatically when your system boots. Your Bastion is always one click away.</li></ul><h2>Cross-Platform from Day One</h2><p>We're shipping for <strong>Windows</strong>, <strong>macOS</strong>, and <strong>Linux</strong> simultaneously. No "coming soon" for any platform. Every Fortress defender gets the same experience regardless of their OS.</p><div class="highlight-box"><strong>Same account. Same Bastions. Same everything.</strong> The desktop app syncs with your existing Fortized account. Log in and you're exactly where you left off — channels, roles, Onyx balance, Radiance status, all of it.</div><h2>Built for the Long Run</h2><p>This is version one, but we're already planning what comes next. Voice and Party Room integration in the native client, custom keybinds, a compact mode for smaller screens, and deeper OS integrations are all on the roadmap.</p><p>The desktop app is available now on the <a href="/download" style="color:var(--acc);text-decoration:underline;">Download page</a>. Grab it for your platform and bring the Fortress to your desktop.</p><p>The gates are open. The walls are strong. Now they're on your machine.</p><p class="sign-off">— Staw, Chief Executive Officer · Swiftaw</p>`
  },
  betalive: {

    authorInitial:'S', authorPillLabel:'Swiftaw',

    banner:'/Onyx banner.png',
    content:`<p class="lead">At Fortized, we believe that building a community shouldn't just be work — it should be rewarding. After an intensive R&D sprint, we are thrilled to officially pull back the curtain on <strong>The Atelier.</strong></p><p>The Atelier is your new hub for progression within the Fortress. It's a space where your loyalty and social reach translate directly into premium status and exclusive aesthetic upgrades.</p><h2>How It Works: The Path of Onyx</h2><ul><li><strong>Complete Quests:</strong> Engage with the community and help us grow.</li><li><strong>Recruit Your Squad:</strong> Invite new allies to Fortized. As you bring more people in, your Onyx reserves grow.</li><li><strong>Daily Rewards:</strong> Consistency pays off. Claim your daily Onyx bonus to keep your balance climbing.</li></ul><h2>Ascend to Radiance</h2><p>What do you do with a mountain of Onyx? You trade it for <span class="radiance-badge-inline">✨ Radiance</span>.</p><p>Radiance is our premium status that sets you apart. Exchange your hard-earned Onyx for Radiance packs ranging from 24-hour boosts to full 30-day memberships. No credit card required.</p><div class="highlight-box"><strong>No credit card. No paywalls.</strong> Radiance is earned entirely through community participation.</div><h2>Radiance Perks</h2><div class="perks-grid"><div class="perk-card"><span class="perk-icon">🎨</span><div class="perk-body"><div class="perk-title">Custom Profile Badge</div><div class="perk-desc">Wear the exclusive Radiance Shield across every Bastion.</div></div></div><div class="perk-card"><span class="perk-icon">🌟</span><div class="perk-body"><div class="perk-title">Animated Border</div><div class="perk-desc">A glowing animated avatar frame that signals your status instantly.</div></div></div><div class="perk-card"><span class="perk-icon">💬</span><div class="perk-body"><div class="perk-title">Extended Messaging</div><div class="perk-desc">Messages up to 4,000 characters.</div></div></div>   safety: {
    category:'Safety', date:'February 20, 2026', readTime:'4 min read',
    authorInitial:'W', authorPillLabel:'Swiftaw Safety Department',
    title:'How Swiftaw Safety Protects Your Bastion', bylineName:'Weaverdant',
    bylineRole:'Chief Safety Officer, Swiftaw',
    tagClass:'tag-safety', tagLabel:'Safety',
    banner:'/FortNovelHeader.png',
    content:`<p class="lead">As head of the Swiftaw Safety Department, my role is to ensure that every Bastion within Fortized remains under the complete sovereignty of its owner.</p><p>The Fortized Security Department operates as a dedicated force within the broader Swiftaw Safety framework. Our mission is simple: keep the Fortress standing, no matter what.</p><h2>Layered Defense Infrastructure</h2><p>We approach platform security the same way a military engineer approaches a fortification — in layers. Each layer is designed to stop threats before they reach the next.</p><div class="highlight-box"><strong>Bastion Sovereignty.</strong> Your Bastion is yours. Our security architecture is designed to ensure that admins retain full, uncompromised control over their communities at all times.</div><h2>Trust &amp; Transparency</h2><p>We believe that security only works when it's visible. That's why the Safety Department publishes regular updates on our practices, incident responses, and ongoing improvements.</p><p class="sign-off">— Weaverdant, Chief Safety Officer · Swiftaw Safety Department</p>`

  gates: {

    authorInitial:'M', authorPillLabel:'Swiftaw',

wn, you can hand the keys to a trusted member without nuking the Bastion.</p><div class="highlight-box"><strong>Bastions 2.0 is live now.</strong> Every existing Bastion automatically gains access to the new room types, Roles 2.0, AutoMod 2.0, and the full Boost tier system. New Bastions created from templates will include the updated channel presets out of the box.</div><p>This update represents our vision for what community infrastructure should look like — powerful enough for serious teams, accessible enough for casual hangouts, and earned entirely through participation.</p><p>We're just getting started. The Fortress grows stronger.</p><p class="sign-off">— Tyrianum, Chief R&D Officer · Swiftaw R&D Department</p>`

    ? `<div class="article-from-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11v2l13 4V7L3 11zm15-1v4l3-1v-2l-3-1z"/></svg>From announcement${a.fromBastion ? ' · ' + a.fromBastion : ''}</div>`
    : '';

        <div class="byline-role">${a.bylineRole || ''}</div>
      </div>
      <div class="byline-org">${a.authorPillLabel || ''}</div>
    </div>
    <div class="article-prose">${a.content}</div>
  `;
  document.title = `${a.title} — Fortized Newsroom`;
  document.getElementById('blog-list-view').classList.add('hidden');
  document.getElementById('article-view').classList.add('open');
  if (typeof twemoji !== 'undefined') twemoji.parse(document.getElementById('article-content'), { folder: 'svg', ext: '.svg' });

}

function openArticle(id) {
  if (!ARTICLES[id]) return;
  if (ARTICLES[id].link) { window.location.href = ARTICLES[id].link; return; }
  const url = new URL(window.location.href);
  url.searchParams.set('article', id);
  history.pushState({ articleId: id }, '', url.toString());
  renderArticle(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeArticle() {
  const url = new URL(window.location.href);
  url.searchParams.delete('article');
  history.pushState({ articleId: null }, '', url.toString());
  document.getElementById('blog-list-view').classList.remove('hidden');
  document.getElementById('article-view').classList.remove('open');
  document.title = 'Fortized Newsroom';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('popstate', function(e) {
  const id = e.state && e.state.articleId;
  if (id && ARTICLES[id]) { renderArticle(id); }
  else {
    document.getElementById('blog-list-view').classList.remove('hidden');
    document.getElementById('article-view').classList.remove('open');
    document.title = 'Fortized Newsroom';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ── Load Supabase admin announcements (existing source) ──
async function loadAdminAnnouncements() {
  try {
    const res = await fetch(SB_URL + '/rest/v1/admin_kv?key=eq.announcements&select=data', { headers: SB_HEADERS });
    if (!res.ok) return 0;
    const rows = await res.json();
    if (!rows?.length || !rows[0]?.data) return 0;
    const announcements = rows[0].data;
    if (!Array.isArray(announcements)) return 0;
    const published = announcements.filter(a => a.published && a.title);
    let added = 0;
    for (const a of published) {
      const slug = 'ann_' + (a.id || '').replace(/[^a-z0-9_]/gi, '_');
      if (ARTICLES[slug]) continue;
      let bodyHtml = (a.body || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      bodyHtml = bodyHtml.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      bodyHtml = bodyHtml.replace(/__(.*?)__/g, '<em>$1</em>');
      const lines = bodyHtml.split(/\n+/);
      let content = '<p class="lead">' + (lines[0] || '') + '</p>';
      const rest = lines.slice(1);
      let inBullets = false;
      for (const line of rest) {
        if (line.startsWith('• ') || line.startsWith('- ')) {
          if (!inBullets) { content += '<ul>'; inBullets = true; }
          content += '<li>' + line.replace(/^[\u2022\-]\s*/, '') + '</li>';
        } else {
          if (inBullets) { content += '</ul>'; inBullets = false; }
          if (line.trim()) content += '<p>' + line + '</p>';
        }
      }
      if (inBullets) content += '</ul>';
      let dateStr = '';
      try {
        const d = new Date(a.createdAt);
        dateStr = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      } catch { dateStr = 'Recent'; }
      const authorName = a.author || a.createdBy || 'Fortized';
      if (HIDDEN_AUTHORS.has(authorName.toLowerCase().trim())) continue;
      const banner = a.image || extractImageFromText(a.body) || FALLBACK_BANNER;
      ARTICLES[slug] = {
        category: 'Announcement', date: dateStr, readTime: Math.max(1, Math.ceil((a.body||'').split(/\s+/).length / 200)) + ' min read',
        authorInitial: authorName.charAt(0).toUpperCase(), authorPillLabel: 'Fortized',
        title: a.title, bylineName: authorName,
        authorUsername: authorName,
        bylineRole: 'Fortized Team',
        tagClass: 'tag-announce', tagLabel: 'Announcement',
        banner,
        createdAt: (() => { try { return new Date(a.createdAt).getTime() || 0; } catch { return 0; } })(),
        content: content
      };
      added++;
    }
    return added;
  } catch(e) { console.warn('[Newsroom] admin announcements load failed:', e); return 0; }
}

async function loadForumAnnouncementPosts() {
  try {

    if (!r.ok) return 0;

    if (!Array.isArray(bastions)) return 0;

    const annChannels = [];
    for (const b of bastions) {
      const name = (b.data && (b.data.name || b.data.title)) || 'Bastion';
      // Bastions sometimes store channels under various keys
      const buckets = [b.data && b.data.channels, b.data && b.data.rooms, b.data && b.data.chambers].filter(Array.isArray);
      const list = [].concat(...buckets);
      for (const ch of list) {
        const t = String((ch && (ch.type || ch.kind || ch.category)) || '').toLowerCase();
        if (t === 'announcement' || t === 'announcements') {
          // bastion_msgs.channel_id is keyed by channel.name when channel.id is missing
          const channelKey = (ch && (ch.id || ch.name)) || null;
          if (channelKey) annChannels.push({ bastionId: b.id, bastionName: name, channelId: channelKey, channelName: ch.name || channelKey });
        }
      }
    }
    if (!annChannels.length) return 0;

    let added = 0;
    for (const c of annChannels) {
      // Pull ALL messages from each announcement channel (paged), not just the latest.
      let offset = 0; const PAGE = 200;
      while (true) {
        const r2 = await fetch(`${SB_URL}/rest/v1/bastion_msgs?bastion_id=eq.${encodeURIComponent(c.bastionId)}&channel_id=eq.${encodeURIComponent(c.channelId)}&select=id,from,text,timestamp,time&order=timestamp.desc&limit=${PAGE}&offset=${offset}`, { headers: SB_HEADERS });
        if (!r2.ok) break;
        const msgs = await r2.json();
        if (!Array.isArray(msgs) || msgs.length === 0) break;
        for (const m of msgs) {
          if (!m || !m.text) continue;
          if (HIDDEN_AUTHORS.has(String(m.from || '').toLowerCase().trim())) continue;
          const slug = 'forum_' + slugifyUsername(c.bastionId) + '_' + slugifyUsername(c.channelId) + '_' + slugifyUsername(m.id);
          if (ARTICLES[slug]) continue;
          const text = String(m.text);
          // Strip embedded image markdown from displayed body so we don't double-render
          const cleaned = text.replace(/!\[[^\]]*\]\([^)\s]+\)/g, '').trim();
          const lines = cleaned.split(/\n+/).filter(Boolean);
          const title = (lines[0] || 'Announcement').slice(0, 140);
          const restLines = lines.slice(1);
          let content = '<p class="lead">' + escAttr(lines[0] || '') + '</p>';
          for (const line of restLines) content += '<p>' + escAttr(line) + '</p>';
          let ts = Date.now();
          try {
            ts = m.timestamp ? (Number.isFinite(+m.timestamp) ? +m.timestamp : new Date(m.timestamp).getTime()) : Date.now();
          } catch {}
          const dateStr = new Date(ts).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
          const banner = extractImageFromText(text) || FALLBACK_BANNER;
          ARTICLES[slug] = {
            category: 'Announcement',
            date: dateStr,
            createdAt: ts,
            readTime: Math.max(1, Math.ceil(text.split(/\s+/).length / 200)) + ' min read',
            authorInitial: (m.from || 'F').charAt(0).toUpperCase(),
            authorPillLabel: c.bastionName,
            title,
            bylineName: m.from || 'Fortized',
            authorUsername: m.from || '',
            bylineRole: c.bastionName + ' · ' + c.channelName,
            tagClass: 'tag-announce',
            tagLabel: 'Announcement',
            banner,
            fromAnnouncement: true,
            fromBastion: c.bastionName,
            content
          };
          added++;
        }
        if (msgs.length < PAGE) break;
        offset += PAGE;
      }
    }
    return added;
  } catch (e) {
    console.warn('[Newsroom] forum announcements load failed:', e);
    return 0;
  }
}

// ── Bootstrap ──
renderCategories();
renderGrid();

(async () => {
  const [a, b] = await Promise.all([loadAdminAnnouncements(), loadForumAnnouncementPosts()]);
  if (a + b > 0) { renderCategories(); renderGrid(); }
  // Open article from URL after load (may target dynamic slug)
  const params = new URLSearchParams(window.location.search);
  const id = params.get('article');
  if (id && ARTICLES[id]) renderArticle(id);
})();

(function() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('article');
  if (id && ARTICLES[id]) { renderArticle(id); history.replaceState({ articleId: id }, '', window.location.href); }
})();
