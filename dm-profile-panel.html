<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DM Profile Panel</title>
<style>
:root{--panel:#0e1117;--panel2:#161a28;--channel:#13161d}
body{background:#000;padding:20px}
.dm-up-card{margin:14px 16px 0;padding:11px 14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:10px}
.dm-up-banner{position:relative;height:100px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#1a1a2e,#0f3460)}
.dm-up-banner::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(to top,var(--channel),transparent)}
.dm-up-av-area{display:flex;align-items:center;gap:8px;padding:0 16px;margin-top:-26px;position:relative;z-index:2}
.dm-up-av{width:72px;height:72px;border-radius:50%;overflow:hidden;border:4px solid var(--channel);background:var(--panel2)}
.dm-up-av img{width:100%;height:100%;object-fit:cover}
.dm-up-identity{padding:10px 18px 0}
.dm-up-displayname{font-size:18px;font-weight:800;color:#fff}
.dm-up-handle{flex:1;min-width:0;font-size:12.5px;color:rgba(255,255,255,.42)}
.dm-up-bio{padding:12px 18px 4px;font-size:12.5px;color:rgba(255,255,255,.62);line-height:1.6}
.dm-up-card-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.22);margin-bottom:5px}
.dm-up-card-body{font-size:12.5px;color:rgba(255,255,255,.55);font-weight:500}
</style>
</head>
<body>
<!-- EXACT FROM APP: DM sidebar profile panel -->
<div class="dm-up-card" style="margin:0;padding:0;">
  <div class="dm-up-banner"></div>
  <div class="dm-up-av-area">
    <div class="dm-up-av"><img src="/Onyx.png"></div>
  </div>
  <div class="dm-up-identity">
    <div class="dm-up-displayname">DMUsername</div>
    <div class="dm-up-handle">@dmuser</div>
  </div>
  <div class="dm-up-bio">Hey! Let's chat! 😊</div>
  <div class="dm-up-card">
    <div class="dm-up-card-title">Member Since</div>
    <div class="dm-up-card-body">15 Mar 2024</div>
  </div>
</div>
</body>
</html>
