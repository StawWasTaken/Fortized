<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Connected — Fortized</title>
<style>
body{margin:0;background:#080a0f;color:#fff;font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;}
.wrap{text-align:center;padding:40px;}
.icon{margin-bottom:16px;}
.icon svg{width:48px;height:48px;}
h2{font-size:20px;font-weight:700;margin-bottom:8px;}
p{font-size:14px;color:rgba(255,255,255,.5);}
</style>
</head>
<body>
<div class="wrap">
<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1DB954" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
<h2>Spotify Connected!</h2>
<p>This window will close automatically.</p>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');
  if (code && state) {
    // Send the code to the server relay so the app can pick it up
    fetch('/api/spotify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: state, code: code })
    }).then(function() {
      // Also try localStorage in case we're in the same context (browser)
      try { localStorage.setItem('spotify_auth_code', code); } catch(e) {}
      setTimeout(function() { window.close(); }, 1500);
    }).catch(function() {
      // Server relay failed, fall back to localStorage only
      try { localStorage.setItem('spotify_auth_code', code); } catch(e) {}
      setTimeout(function() { window.close(); }, 1500);
    });
  } else {
    document.querySelector('h2').textContent = 'Connection Failed';
    document.querySelector('p').textContent = 'No authorization code received. Please try again.';
  }
})();
</script>
</body>
</html>
