.auth-card.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }

<body>

<div class="auth-page">
  <div class="auth-card" id="authCard">
    <div class="auth-brand">
      <img class="mark" src="/Fortized icon.png" alt="Fortized">
    </div>
    <h1>Welcome back.</h1>
    <p class="sub">Sign in to your Fortress.</p>

    <div id="error" class="auth-error"></div>

    <div class="auth-form">
      <div class="auth-field">
        <label for="identifier">Username or email</label>
        <input type="text" id="identifier" placeholder="you, or you@somewhere.com" autocomplete="username">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" class="has-toggle" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="pw-toggle" id="togglePw" tabindex="-1" aria-label="Toggle password visibility">
          <svg><use href="#i-eye"/></svg>
        </button>
      </div>

      <div class="auth-row">
        <label class="auth-checkbox">
          <input type="checkbox" id="rememberMe" checked>
          <span class="box"><svg><use href="#i-check"/></svg></span>
          Remember me
        </label>
        <a href="/support/contact">Need help?</a>
      </div>

      <button class="auth-submit btn-primary" id="loginBtn">
        Sign in <svg><use href="#i-arrow-right"/></svg>
      </button>
    </div>

    <div class="auth-foot">
      New here? <a href="/signup">Create an account</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/FortizedSocial-supabase.js?v=20260430e"></script>
<script src="/firebase-compat-shim.js?v=20260430e"></script>
<script>
const loginBtn        = document.getElementById('loginBtn');
const identifierInput = document.getElementById('identifier');
const passwordInput   = document.getElementById('password');
const errorDiv        = document.getElementById('error');
const authCard        = document.getElementById('authCard');

const existing = localStorage.getItem('ftz_current') || localStorage.getItem('fortized_current_user');
if (existing) window.location.href = '/app';

const togglePw = document.getElementById('togglePw');
togglePw.addEventListener('click', () => {
  const isPassword = passwordInput.type === 'password';
  passwordInput.type = isPassword ? 'text' : 'password';
  togglePw.querySelector('use').setAttribute('href', isPassword ? '#i-eye-slash' : '#i-eye');
});

[identifierInput, passwordInput].forEach(el =>
  el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); })
);
loginBtn.addEventListener('click', doLogin);

function showError(msg) {
  errorDiv.textContent = msg;
  errorDiv.classList.add('show');
  authCard.classList.remove('shake');
  void authCard.offsetWidth;
  authCard.classList.add('shake');
}

// Decode the base64url credential id (the form WebAuthn stores) back
// into the ArrayBuffer that navigator.credentials.get() expects in
// allowCredentials[i].id.
function _b64uToBuf(s) {
  s = String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  try {
    const bin = atob(s);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf.buffer;
  } catch { return new ArrayBuffer(0); }
}

// Second factor — if the user has registered passkeys/security keys,
// require one to complete sign-in. Server-side challenge verification
// is the follow-up step when the auth backend is ready; for now we
// trust a non-null cred response from the platform dialog.
async function _verifySecurityKeyFactor(passkeys) {
  if (!window.PublicKeyCredential || !navigator.credentials || !navigator.credentials.get) {
    showError('This browser does not support security keys. Use a passkey-capable browser.');
    return false;
  }
  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const allowCredentials = (passkeys||[]).map(k => ({
      type: 'public-key',
      id: _b64uToBuf(k.id),
    }));
    const cred = await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials,
        userVerification: 'preferred',
        timeout: 60000,
        rpId: location.hostname || 'fortized.com',
      }
    });
    return !!cred;
  } catch (e) {
    console.error('Security key verification failed', e);
    return false;
  }
}

async function doLogin() {
  const id   = identifierInput.value.trim();
  const pass = passwordInput.value.trim();
  errorDiv.textContent = '';
  errorDiv.classList.remove('show');
  if (!id || !pass) { showError('Please fill in all fields.'); return; }

  setLoading(true);
  try {
    const result = await FortizedSocial.login(id, pass);
    if (!result.ok) {
      showError(result.msg);
      setLoading(false);
      return;
    }
    const user = result.user;

    // MFA gate — if the user has registered security keys, require one
    // before completing sign-in. We swap the button label so the user
    // knows the platform dialog is coming.
    const passkeys = (user && user.security && Array.isArray(user.security.passkeys)) ? user.security.passkeys : [];
    if (passkeys.length > 0) {
      loginBtn.innerHTML = 'Waiting for security key…';
      const ok = await _verifySecurityKeyFactor(passkeys);
      if (!ok) {
        showError('Security key verification failed or was cancelled.');
        loginBtn.innerHTML = 'Sign in <svg><use href="#i-arrow-right"/></svg>';
        setLoading(false);
        return;
      }
    }

    if (user?.username) {
      localStorage.setItem('ftz_current', user.username);
      localStorage.setItem('fortized_current_user', user.username);
      localStorage.setItem('ftz_user_' + user.username, JSON.stringify(user));
    }
    window.location.href = '/app';
  } catch (err) {
    console.error('Login error:', err);
    showError('Connection error. Check your internet and try again.');
    setLoading(false);
  }
}

function setLoading(on) {
  loginBtn.disabled = on;
  loginBtn.classList.toggle('loading', on);
}
// Suppress browser/password-manager autofill on the credential fields
// (matches the app-wide policy). readonly-until-focus is the belt for
// Chrome's native dropdown; removed the instant the field is used.
(function(){
  var ids = ['identifier','password'];
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if (!el) return;
    el.setAttribute('autocomplete', el.type === 'password' ? 'new-password' : 'off');
    el.setAttribute('autocapitalize','off'); el.setAttribute('autocorrect','off'); el.setAttribute('spellcheck','false');
    el.setAttribute('data-lpignore','true'); el.setAttribute('data-1p-ignore',''); el.setAttribute('data-bwignore',''); el.setAttribute('data-form-type','other');
    el.setAttribute('readonly','');
    var unlock = function(){ el.removeAttribute('readonly'); };
    el.addEventListener('focus', unlock, { once:true });
    el.addEventListener('pointerdown', unlock, { once:true });
  });
  var f = document.querySelector('form'); if (f) f.setAttribute('autocomplete','off');
})();
</script>
<script src="/css/fortized-2026.js"></script>
</body>
</html>
