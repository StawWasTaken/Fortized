<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Auth Callback - Fortized</title>
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: #060810;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: white;
  margin: 0;
}

.container {
  text-align: center;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255, 249, 62, 0.2);
  border-top-color: #fff93e;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.status {
  font-size: 14px;
  color: #7d8a9e;
}

.error {
  color: #f87171;
  padding: 16px;
  background: rgba(248, 113, 113, 0.1);
  border-radius: 8px;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
  <div class="spinner"></div>
  <div class="status" id="status">Connecting to Swiftaw Cloud...</div>
  <div class="error" id="error" style="display:none;"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// FORTIZED CLOUD CALLBACK HANDLER
// Receives authorization code from Cloud and exchanges it for session token
// ════════════════════════════════════════════════════════════════════════

const API_URL = 'https://fortized.com/api';

async function handleCallback() {
  try {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');

    // Verify state (CSRF protection)
    const savedState = sessionStorage.getItem('cloud_auth_state');
    if (!state || state !== savedState) {
      throw new Error('Security validation failed. Please try again.');
    }
    sessionStorage.removeItem('cloud_auth_state');

    if (!code) {
      throw new Error('No authorization code received. Please try again.');
    }

    document.getElementById('status').textContent = 'Authenticating...';

    // Exchange code for Fortized session
    const response = await fetch(`${API_URL}/auth/cloud-callback`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, state })
    });

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.message || 'Authentication failed');
    }

    const data = await response.json();

    document.getElementById('status').textContent = 'Redirecting...';

    // Save session
    localStorage.setItem('fortized_token', data.session_token);
    localStorage.setItem('fortized_user_id', data.user.id);
    localStorage.setItem('fortized_username', data.user.username);

    // Determine where to redirect
    const referrer = sessionStorage.getItem('signup_referrer');
    if (referrer === 'signup') {
      // Came from signup - send back user data to signup page
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type: 'cloud_auth_complete',
          cloudUsername: data.user.username,
          cloudEmail: data.user.email
        }, window.location.origin);
      }
      window.close();
    } else {
      // Came from login - redirect to app
      window.location.href = '/app';
    }

  } catch (error) {
    console.error('Callback error:', error);
    document.getElementById('status').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Error: ' + error.message;

    // Offer retry
    setTimeout(() => {
      document.getElementById('error').innerHTML +=
        '<br><br><a href="/login" style="color: #fff93e; text-decoration: none;">Back to Login</a>';
    }, 2000);
  }
}

// Run on page load
window.addEventListener('load', handleCallback);
</script>

</body>
</html>
