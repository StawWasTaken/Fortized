<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Profile Preview</title>
<style>
:root{--panel:#0e1117;--panel2:#161a28;--accent:#fff93e;--font-display:'Outfit',sans-serif;--font-ui:'Inter',sans-serif;--radius-pill:20px}
body{background:#000;padding:20px}
.mini-profile-preview{position:relative;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.65),0 6px 24px rgba(0,0,0,.35);overflow:hidden;width:330px;margin:0 auto}
@keyframes mppSlideIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
.mpp-banner{height:70px;position:relative;overflow:hidden;background:linear-gradient(135deg,#1a1a2e 0%,#0d1525 50%,#12101a 100%);}
.mpp-banner img{width:100%;height:100%;object-fit:cover;}
.mpp-banner::after{content:'';position:absolute;bottom:0;left:0;right:0;height:45px;background:linear-gradient(to top,var(--panel),transparent);}
.mpp-banner-accent{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#f59e0b);}
.mpp-av-area{position:relative;padding:0 16px;margin-top:-30px;z-index:2;display:flex;align-items:center;gap:12px;}
.mpp-av{width:90px;height:90px;border-radius:50%;overflow:visible;background:var(--panel2);cursor:pointer;position:relative;flex-shrink:0;}
.mpp-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.mpp-decoration{position:absolute;top:-8px;left:-8px;width:106px !important;height:106px !important;pointer-events:none;}
.mpp-status-dot{position:absolute;bottom:2px;left:58px;width:20px;height:20px;background:var(--panel);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.mpp-identity{padding:8px 16px 0;}
.mpp-displayname{font-family:var(--font-display);font-size:18px;font-weight:800;color:#fff;cursor:pointer;transition:all .12s;line-height:1.25;}
.mpp-displayname:hover{filter:brightness(1.1);}
.mpp-username{font-size:13px;color:rgba(255,255,255,.4);margin-top:2px;}
.mpp-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.mpp-badges img{width:22px !important;height:22px !important;}
.mpp-status-row{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 0;font-size:12px;color:rgba(255,255,255,.5);}
.mpp-status-label{font-weight:600;}
.mpp-cs{padding:2px 8px;background:rgba(255,255,255,.04);border-radius:12px;}
.mpp-streak{color:#f59e0b;font-weight:600;}
.mpp-bio{padding:8px 16px;font-size:13px;color:rgba(255,255,255,.6);line-height:1.5;}
.mpp-meta{padding:0 16px;font-size:11px;color:rgba(255,255,255,.3);}
.mpp-roles{display:flex;flex-wrap:wrap;gap:4px;padding:4px 16px;}
.mpp-role-tag{padding:3px 8px;background:rgba(255,255,255,.04);border-radius:12px;font-size:11px;}
.mpp-games{display:flex;gap:4px;padding:8px 16px;flex-wrap:wrap;align-items:center;}
.mpp-games>span{width:28px;height:28px;background:rgba(255,255,255,.06);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;}
.mpp-games img{width:28px;height:28px;border-radius:6px;object-fit:cover;}
.mpp-actions{display:flex;gap:8px;padding:12px 16px;}
.mpp-btn-primary{flex:1;padding:10px;background:var(--accent);color:#13161d;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.mpp-btn-secondary{flex:1;padding:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<!-- EXACT FROM APP: mini profile preview popover -->
<div class="mini-profile-preview">
  <div class="mpp-banner"><div style="width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#0f3460);"></div></div>
  <div class="mpp-av-area">
    <div class="mpp-av"><img src="/Onyx.png"></div>
    <span class="mpp-status-dot"><span style="width:10px;height:10px;background:#3ecf6e;border-radius:50%;"></span></span>
  </div>
  <div class="mpp-identity">
    <div class="mpp-displayname">FortizedUser</div>
    <div class="mpp-username">@fortizeduser · @they/them</div>
    <div class="mpp-badges"><img src="/Onyx.png" width="22" height="22"><img src="/AtelierBadge.png" width="22" height="22"></div>
  </div>
  <div class="mpp-status-row">
    <span class="mpp-status-label" style="color:#3ecf6e">Online</span>
    <span class="mpp-cs">🎮 Playing Minecraft</span>
    <span class="mpp-streak">🔥 42 day streak</span>
  </div>
  <div class="mpp-bio">Hello! Welcome to Fortized 🌟</div>
  <div class="mpp-meta">Member since 15 Mar 2024</div>
  <div class="mpp-roles"><span class="mpp-role-tag"><span style="width:8px;height:8px;background:#60a5fa;border-radius:50%;display:inline-block;margin-right:4px;"></span>Moderator</span><span class="mpp-role-tag"><span style="width:8px;height:8px;background:#f59e0b;border-radius:50%;display:inline-block;margin-right:4px;"></span>Developer</span></div>
  <div class="mpp-games"><span>G</span><img src="/Onyx.png"><img src="/Fortified%20icon.png"><span>+3</span></div>
  <div class="mpp-actions">
    <button class="mpp-btn-primary">Message</button>
    <button class="mpp-btn-secondary">Profile</button>
  </div>
</div>
</body>
</html>
