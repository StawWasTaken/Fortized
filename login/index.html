<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Fortized</title>
<meta name="description" content="Sign in to rejoin your Bastions and squad on Fortized.">
<meta name="theme-color" content="#fff93e">
<link rel="icon" type="image/png" href="/Fortized icon.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
::selection{background:rgba(255,249,62,.2);}
:root{--accent:#fff93e;--accent-dim:rgba(255,249,62,.1);--accent-glow:rgba(255,249,62,.4);--bg:#060810;--panel:rgba(10,13,20,.82);--border:#151b2a;--muted:#4a5568;--muted-light:#7d8a9e;--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);font-family:var(--font-body);color:white;overflow-x:hidden;display:flex;align-items:center;justify-content:center;}

.bg-layer{position:fixed;inset:0;z-index:0;}
.bg-layer::before{content:"";position:absolute;inset:0;background:url("/Fortized banner.png") center/cover no-repeat;opacity:.06;filter:blur(2px) saturate(0.5);}
.bg-layer::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(255,249,62,.04),transparent 70%),linear-gradient(180deg,rgba(6,8,16,0) 0%,rgba(6,8,16,.5) 60%,var(--bg) 100%);}

.bg-grid{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(255,249,62,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,249,62,.012) 1px,transparent 1px);background-size:64px 64px;pointer-events:none;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 0%,transparent 100%);}

.auth-container{position:relative;z-index:10;width:100%;max-width:460px;padding:24px;display:flex;flex-direction:column;align-items:center;}

.auth-brand{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:36px;}
.auth-brand-logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.auth-brand-logo img{height:40px;width:40px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(255,249,62,.2));}
.auth-brand-logo span{font-family:var(--font-display);font-size:22px;font-weight:800;color:#fff;}
.auth-tagline{font-size:13px;color:var(--muted-light);}

.auth-card{width:100%;background:var(--panel);border-radius:20px;border:1px solid var(--border);backdrop-filter:blur(40px);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03) inset;overflow:hidden;position:relative;}
.auth-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(255,249,62,.3) 50%,transparent 95%);}

.auth-card-body{padding:36px 40px 40px;}

.auth-header{margin-bottom:28px;text-align:center;}
.auth-header h1{font-family:var(--font-display);font-size:24px;font-weight:800;color:#fff;margin-bottom:6px;}
.auth-header h1 em{font-style:normal;color:var(--accent);}
.auth-header p{font-size:13.5px;color:var(--muted-light);line-height:1.6;}

.cloud-section{margin-bottom:24px;}
.cloud-section p{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;}

.btn-primary{width:100%;padding:14px;background:var(--accent);color:#080a0f;border:none;border-radius:14px;font-family:var(--font-display);font-size:15px;font-weight:700;cursor:pointer;transition:box-shadow .25s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary:hover{box-shadow:0 0 40px var(--accent-glow),0 4px 20px rgba(255,249,62,.15);}
.btn-primary:active{transform:scale(.98);}

.cloud-logo{filter:drop-shadow(0 0 0 1.5px #ffa43b);}

.auth-divider{display:flex;align-items:center;gap:14px;margin:24px 0;color:#1e2538;font-size:11.5px;font-weight:500;text-transform:uppercase;}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);}

.auth-footer{text-align:center;font-size:13px;color:var(--muted);margin-top:4px;}
.auth-footer a{color:var(--accent);text-decoration:none;font-weight:600;}
.auth-footer a:hover{text-decoration:underline;}

.auth-status{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:28px;}
.status-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500;}
.status-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.status-dot.green{background:#3ecf6e;}

@media(max-width:540px){
  .auth-card-body{padding:28px 24px 32px;}
}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-grid"></div>

<div class="auth-container">

  <div class="auth-brand">
    <a href="/" class="auth-brand-logo">
      <img src="/Fortized icon.png" alt="Fortized" onerror="this.style.display='none'">
      <span>Fortized</span>
    </a>
    <div class="auth-tagline">The fortress awaits your return.</div>
  </div>

  <div class="auth-card">
    <div class="auth-card-body">
      <div class="auth-header">
        <h1>Welcome <em>back</em></h1>
        <p>Sign in to rejoin your Bastions and squad.</p>
      </div>

      <div class="cloud-section">
        <button class="btn-primary" id="cloudLoginBtn">
          <img src="https://swiftaw.com/Cloud%20logo.png" alt="Swiftaw Cloud" class="cloud-logo" style="height:18px;width:auto;opacity:.9;">
          Sign in with Swiftaw Cloud
        </button>
      </div>

      <div class="auth-divider">or</div>

      <div class="auth-footer">
        Don't have a Swiftaw Cloud account? <a href="https://swiftaw.com/cloud/signup" target="_blank">Create one free</a>
      </div>
    </div>
  </div>

  <div class="auth-status">
    <div class="status-item"><span class="status-dot green"></span>Systems online</div>
    <div class="status-item"><span class="status-dot green"></span>Cloud connected</div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// FORTIZED LOGIN × SWIFTAW CLOUD
// Opens Cloud auth in new tab. If already logged in, auto-closes and redirects back.
// ════════════════════════════════════════════════════════════════════════

const CLOUD_AUTH_URL = 'https://swiftaw.com/cloud/auth/link?product=fortized&redirect_uri=https://fortized.com/auth/cloud-callback&state=';

// Check if already logged in
const fortizedToken = localStorage.getItem('fortized_token');
if (fortizedToken) {
  // Already logged in, skip to app
  // Optionally redirect: window.location.href = '/app';
}

// Generate random state for CSRF protection
function generateState() {
  return Math.random().toString(36).substring(2, 15) +
         Math.random().toString(36).substring(2, 15);
}

// "Sign in with Swiftaw Cloud" button
document.getElementById('cloudLoginBtn').addEventListener('click', () => {
  const state = generateState();
  sessionStorage.setItem('cloud_auth_state', state);

  // Open Cloud auth in NEW TAB
  // If user is already logged into Cloud, it will auto-close and redirect back
  window.open(
    CLOUD_AUTH_URL + state,
    'fortized_cloud_auth',
    'width=600,height=700'
  );

  // Check if window was redirected back (token received)
  // Frontend callback will handle the actual authentication
});

// Listen for messages from callback window
window.addEventListener('message', (event) => {
  if (event.origin !== window.location.origin) return;

  if (event.data.type === 'cloud_auth_complete') {
    // Cloud auth completed, save session
    localStorage.setItem('fortized_token', event.data.token);
    localStorage.setItem('fortized_user_id', event.data.userId);

    // Refresh page to show logged-in state
    window.location.reload();
  }
});
</script>

</body>
</html>
