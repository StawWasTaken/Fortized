<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Own Profile Panel</title>
<style>
:root{--panel:#0e1117;--accent:#fff93e;--font-display:'Outfit',sans-serif}
body{background:#000;padding:20px;font-family:var(--font-display)}
.own-profile-panel{position:relative;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.65);overflow:hidden;width:280px;margin:0 auto}
</style>
</head>
<body>
<!-- EXACT FROM APP: own profile panel in userbar -->
<div class="own-profile-panel">
  <div style="height:100px;position:relative;background:linear-gradient(135deg,#161a2e,#0d1a3a,#1a1030);">
    <div style="position:absolute;inset:0;background:linear-gradient(0deg,var(--panel),rgba(12,14,24,.4),transparent);"></div>
  </div>
  <div style="display:flex;align-items:flex-end;gap:11px;padding:0 18px;margin-top:-32px;position:relative;z-index:2;">
    <div style="width:64px;height:64px;border-radius:50%;overflow:hidden;border:4px solid var(--panel);background:#161a28;box-shadow:0 6px 20px rgba(0,0,0,.6);">
      <img src="/Onyx.png" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div style="display:flex;align-items:center;gap:7px;padding-bottom:7px;">
      <span style="width:10px;height:10px;border-radius:50%;background:#3ecf6e;box-shadow:0 0 8px #3ecf655;flex-shrink:0;"></span>
      <span style="font-size:12px;color:rgba(255,255,255,.5);font-weight:500;">Online</span>
    </div>
  </div>
  <div style="padding:10px 18px 0;">
    <div style="font-size:17px;font-weight:800;color:#fff;">MyUsername</div>
    <div style="font-size:12px;color:rgba(255,255,255,.28);margin-top:3px;">@my_username</div>
    <div style="display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:5px 13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:20px;font-size:12px;color:rgba(255,255,255,.5);">🎮 LFG!</div>
  </div>
  <div style="height:1px;background:rgba(255,255,255,.06);margin:13px 18px 7px;"></div>
  <div style="padding:2px 10px;">
    <div style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.06);">
      <span style="width:12px;height:12px;border-radius:50%;background:#3ecf6e;box-shadow:0 0 10px #3ecf655;"></span>
      <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:#fff;">Online</div></div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;">
      <span style="width:12px;height:12px;border-radius:50%;background:#f59e0b;box-shadow:0 0 10px #f59e0b55;"></span>
      <div style="flex:1;"><div style="font-size:13px;font-weight:500;color:rgba(255,255,255,.6);">Idle</div></div>
    </div>
  </div>
  <div style="height:1px;background:rgba(255,255,255,.06);margin:5px 18px;"></div>
  <div style="display:flex;align-items:center;gap:11px;padding:9px 11px;margin:3px 10px;border-radius:10px;cursor:pointer;">
    <span style="font-size:13px;">✏️</span>
    <span style="font-size:13px;color:rgba(255,255,255,.5);font-weight:500;">Edit Custom Status</span>
  </div>
  <div style="padding:7px 10px 12px;display:flex;gap:7px;">
    <button style="flex:1;padding:8px 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;">✏️ Edit Profile</button>
    <button style="flex:1;padding:8px 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;">🔄 Switch</button>
  </div>
</div>
</body>
</html>
