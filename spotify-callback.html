<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Connected — Fortized</title>
<style>
body{margin:0;background:#080a0f;color:#fff;font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;}
.wrap{text-align:center;padding:40px;}
.icon{font-size:48px;margin-bottom:16px;}
h2{font-size:20px;font-weight:700;margin-bottom:8px;}
p{font-size:14px;color:rgba(255,255,255,.5);}
</style>
</head>
<body>
<div class="wrap">
<div class="icon">🎵</div>
<h2>Spotify Connected!</h2>
<p>You can close this window now.</p>
</div>
<script>
// The parent window will read the hash fragment containing the access token
// This page just needs to exist for the redirect
if (window.opener) {
  // Signal to parent that we're done (parent polls our location.hash)
  setTimeout(function() { window.close(); }, 3000);
}
</script>
</body>
</html>
